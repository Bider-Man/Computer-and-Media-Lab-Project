<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow | Weekly Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-cozy"> <!-- Default Theme -->
    <nav>
        <h1>StudyFlow</h1>
        <div>
            <a href="/" class="active">Week View</a>
            <a href="/today">Today View</a>
            <button id="theme-toggle">Switch Theme</button>
        </div>
    </nav>

    <main class="dashboard">
        <!-- Quick Add Forms -->
        <section class="quick-add-panel">
            <h2>Quick Add</h2>
            
            <form action="/add_task" method="POST" class="quick-form">
                <h3>New Task</h3>
                <input type="text" name="title" placeholder="Task name..." required>
                <select name="priority">
                    <option value="High">High Priority</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>
                <input type="number" name="duration" placeholder="Mins" value="30" required>
                <button type="submit">+ Task</button>
            </form>

            <form action="/add_block" method="POST" class="quick-form">
                <h3>New Timetable Block</h3>
                <input type="text" name="title" placeholder="Class/Study..." required>
                <select name="day" required>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>
                <input type="time" name="start_time" required>
                <input type="time" name="end_time" required>
                <button type="submit">+ Block</button>
            </form>
        </section>

        <!-- The Timetable -->
        <section class="timetable-section">
            <h2>Weekly Timetable</h2>
            <div class="timetable-grid">
                {% for block in blocks %}
                <div class="time-block">
                    <span class="block-day">{{ block['day'] }}</span>
                    <strong>{{ block['title'] }}</strong>
                    <span>{{ block['start_time'] }} - {{ block['end_time'] }}</span>
                </div>
                {% else %}
                <p>No blocks scheduled yet. Use the form to add one!</p>
                {% endfor %}
            </div>
        </section>
    </main>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
